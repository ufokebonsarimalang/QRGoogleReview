<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      max-width: 360px;
      width: calc(100% - 40px);
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    a {
      display: block;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #4285f4;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>⭐ Google Review</h2>

  <p>
    Membuka halaman ulasan...
  </p>

  <a id="reviewButton" href="#">
    BUKA ULASAN
  </a>

</div>

<script>

  const placeId = "ChIJNWi0z2-deC4RQzfDw8kDoDA";

  const reviewUrl =
    "https://search.google.com/local/writereview?placeid=" +
    encodeURIComponent(placeId);

  const mapsUrl =
    "https://www.google.com/maps/search/?api=1" +
    "&query=UFO%20Elektronika%20Malang" +
    "&query_place_id=" +
    encodeURIComponent(placeId);

  document.getElementById("reviewButton").href = reviewUrl;

  /*
   * Coba buka aplikasi Google Maps
   */
  setTimeout(function() {

    window.location.href = mapsUrl;

  }, 500);

</script>

</body>
</html>
