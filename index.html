<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER SMARTCARD GENERATOR</title>
    <!-- Gunakan Font Monospace ala Terminal -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Courier Prime', monospace; background-color: #0d0d0d; color: #00ff41; }
        .hacker-card { background: #1a1a1a; border: 1px solid #00ff41; box-shadow: 0 0 15px #00ff4133; }
        input { background: #000 !important; color: #00ff41 !important; border: 1px solid #00ff41 !important; }
        /* Tombol Premium */
        .btn-premium { 
            background: linear-gradient(45deg, #00ff41, #008f11); 
            color: #000; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 0 10px #00ff41; border: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="hacker-card w-full max-w-lg rounded-xl p-6">
        <h1 class="text-xl font-bold text-center mb-6 tracking-widest text-[#00ff41]">
            > GENERATOR SMARTCARD GOOGLE REVIEW
        </h1>

        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-1">ENTER PLACE ID:</label>
                <input type="text" id="inputQuery" placeholder="ChIJ..." 
                    class="w-full px-4 py-3 rounded-lg focus:outline-none">
            </div>

            <button onclick="generateCard()" id="btnProcess"
                class="w-full py-3 rounded-lg btn-premium transition transform hover:scale-105 active:scale-95">
                [ EXECUTE GENERATE ]
            </button>
        </div>

        <div id="loadingStatus" class="hidden text-center mt-4 text-[#00ff41] animate-pulse">
            > ACCESSING GOOGLE DATABASE...
        </div>

        <canvas id="canvas" width="1080" height="1080" class="hidden"></canvas>

        <div id="resultSection" class="hidden mt-6 text-center border-t border-[#00ff41] pt-4">
            <h3 class="text-sm font-semibold mb-3">[ STATUS: SUCCESS ]</h3>
            <div class="flex justify-center mb-4">
                <img id="outputPreview" class="w-64 rounded-lg border border-[#00ff41]" alt="Result">
            </div>
            <a id="downloadBtn" download="SmartCard_Review.png" 
                class="inline-block bg-white text-black px-6 py-2 rounded font-bold hover:bg-[#00ff41] transition">
                DOWNLOAD PNG
            </a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYenFPWC8zwnYgeF_Rl3W8o8Ndw4muz4--bfCW6tm6CvCVMIGkvkUf-T2TLpaIwxsHTw/exec";

        async function generateCard() {
            let query = document.getElementById('inputQuery').value.trim();
            const loadingStatus = document.getElementById('loadingStatus');
            const resultSection = document.getElementById('resultSection');
            const btnProcess = document.getElementById('btnProcess');

            if (!query) { alert("INPUT MISSING!"); return; }

            loadingStatus.classList.remove('hidden');
            resultSection.classList.add('hidden');
            btnProcess.disabled = true;

            try {
                const response = await fetch(`${SCRIPT_URL}?q=${encodeURIComponent(query)}`);
                const reviewLink = await response.text();

                const tempDiv = document.createElement('div');
                new QRCode(tempDiv, { text: reviewLink, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.H });

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    const template = new Image();
                    template.src = 'template.png';

                    template.onload = function() {
                        ctx.drawImage(template, 0, 0, canvas.width, canvas.height);
                        const qrCanvas = tempDiv.querySelector('canvas');
                        const qrImage = new Image();
                        qrImage.src = qrCanvas.toDataURL("image/png");

                        qrImage.onload = function() {
                            ctx.drawImage(qrImage, 350, 450, 340, 340);
                            const finalDataUrl = canvas.toDataURL("image/png");
                            document.getElementById('outputPreview').src = finalDataUrl;
                            document.getElementById('downloadBtn').href = finalDataUrl;
                            loadingStatus.classList.add('hidden');
                            resultSection.classList.remove('hidden');
                            btnProcess.disabled = false;
                        };
                    };
                }, 500);
            } catch (error) {
                loadingStatus.classList.add('hidden');
                btnProcess.disabled = false;
                alert("SYSTEM ERROR: " + error);
            }
        }
    </script>
</body>
</html>
