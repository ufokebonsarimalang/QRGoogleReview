<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kartu Google Review Otomatis</title>
    <!-- Library QRCodeJS & Tailwind CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl p-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-1">Generator Kartu Review</h1>
        <p class="text-xs text-gray-500 text-center mb-6">Masukkan nama bisnis atau link maps, kartu siap download dalam detik.</p>

        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Bisnis / Link Google Maps</label>
                <input type="text" id="inputQuery" placeholder="Contoh: Kopi Senja atau https://maps.app.goo.gl/..." 
                    class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            </div>

            <button onclick="generateCard()" id="btnProcess"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-md text-sm">
                Proses & Buat Kartu
            </button>
        </div>

        <!-- Status Loading -->
        <div id="loadingStatus" class="hidden text-center mt-4 text-blue-600 text-sm font-medium animate-pulse">
            Sedang merakit link mobile & menyusun gambar...
        </div>

        <!-- Canvas Tersembunyi untuk Render Gambar -->
        <canvas id="canvas" width="1080" height="1080" class="hidden"></canvas>

        <!-- Hasil Akhir -->
        <div id="resultSection" class="hidden mt-6 text-center border-t pt-4">
            <h3 class="text-sm font-semibold text-green-600 mb-3">Kartu Berhasil Dibuat! 🎉</h3>
            <div class="flex justify-center mb-4">
                <img id="outputPreview" class="w-64 rounded-xl shadow-lg border" alt="Hasil Kartu Review">
            </div>
            <a id="downloadBtn" download="Kartu-Google-Review.png" 
                class="inline-block bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-6 py-2.5 rounded-lg transition shadow-md">
                Download Gambar Kartu (PNG)
            </a>
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYenFPWC8zwnYgeF_Rl3W8o8Ndw4muz4--bfCW6tm6CvCVMIGkvkUf-T2TLpaIwxsHTw/exec";

        async function generateCard() {
            const query = document.getElementById('inputQuery').value.trim();
            const loadingStatus = document.getElementById('loadingStatus');
            const resultSection = document.getElementById('resultSection');
            const btnProcess = document.getElementById('btnProcess');

            if (!query) {
                alert("Mohon masukkan nama bisnis atau link Google Maps!");
                return;
            }

            loadingStatus.classList.remove('hidden');
            resultSection.classList.add('hidden');
            btnProcess.disabled = true;

            try {
                // 1. Panggil GAS untuk merubah input menjadi link mobile review
                const response = await fetch(`${SCRIPT_URL}?q=${encodeURIComponent(query)}`);
                const mobileLink = await response.text();

                // 2. Buat QR Code secara instan di background
                const tempDiv = document.createElement('div');
                new QRCode(tempDiv, {
                    text: mobileLink,
                    width: 400,
                    height: 400,
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Tunggu render QR selesai sejenak
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');

                    const template = new Image();
                    template.src = 'template.png'; // Pastikan file gambar templat ada di folder yang sama

                    template.onload = function() {
                        // Gambar templat ke ukuran penuh 1080x1080
                        ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

                        const qrCanvas = tempDiv.querySelector('canvas');
                        const qrImage = new Image();
                        qrImage.src = qrCanvas.toDataURL("image/png");

                        qrImage.onload = function() {
                            // --- ATUR POSISI DAN UKURAN QR CODE DI TEMPLAT ANDA ---
                            // Sesuaikan angka di bawah ini jika letak QR di template Anda ingin digeser:
                            const qrX = 350;  // Titik koordinat X (geser kiri-kanan)
                            const qrY = 440;  // Titik koordinat Y (geser atas-bawah)
                            const qrSize = 380; // Ukuran lebar & tinggi kotak QR

                            ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);

                            // Tampilkan hasil akhir ke layar
                            const finalDataUrl = canvas.toDataURL("image/png");
                            document.getElementById('outputPreview').src = finalDataUrl;
                            document.getElementById('downloadBtn').href = finalDataUrl;

                            loadingStatus.classList.add('hidden');
                            resultSection.classList.remove('hidden');
                            btnProcess.disabled = false;
                        };
                    };

                    template.onerror = function() {
                        loadingStatus.classList.add('hidden');
                        btnProcess.disabled = false;
                        alert("Gagal memuat file 'template.png'. Pastikan gambar templat ada di folder yang sama!");
                    };

                }, 500);

            } catch (error) {
                loadingStatus.classList.add('hidden');
                btnProcess.disabled = false;
                alert("Terjadi kesalahan koneksi ke server: " + error);
            }
        }
    </script>
</body>
</html>
