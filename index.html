<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aktivasi QR Google Review</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
      color: #222;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4285f4;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #4285f4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #3367d6;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #666;
      font-size: 14px;
      display: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ⭐
    </div>

    <h1>Aktivasi QR Google Review</h1>

    <p class="subtitle">
      Masukkan data untuk mengaktifkan QR Google Review Anda.
    </p>

    <div class="form-group">
      <label for="nama">Nama Toko</label>
      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama toko"
      >
    </div>

    <div class="form-group">
      <label for="kode">Kode Aktivasi</label>
      <input
        type="text"
        id="kode"
        placeholder="Masukkan kode aktivasi"
      >
    </div>

    <button onclick="aktivasi()">
      AKTIVASI
    </button>

    <div id="status" class="status"></div>

    <div class="footer">
      Sistem Aktivasi QR Google Review
    </div>

  </div>

  <script>
    function aktivasi() {

      const nama = document.getElementById("nama").value.trim();
      const kode = document.getElementById("kode").value.trim();
      const status = document.getElementById("status");

      status.style.display = "block";

      if (!nama || !kode) {
        status.innerText = "Silakan isi nama toko dan kode aktivasi.";
        return;
      }

      status.innerText = "Data diterima. Sistem aktivasi akan diproses.";
    }
  </script>

</body>
</html>
