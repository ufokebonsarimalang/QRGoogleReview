<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCard Google Review</title>
    <!-- Menggunakan Font Futuristik Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f8fafc; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        .panel { background: #111827; border: 1px solid #1f2937; box-shadow: 0 0 25px rgba(0, 0, 0, 0.5); }
        input { background: #030712 !important; color: #38bdf8 !important; border: 1px solid #374151 !important; }
        
        /* Efek Tombol Menyala (Glow Effect) */
        .btn-glow {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-weight: 600;
            border: none;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 40px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
        }

        /* Efek Tombol Download Menyala Hijau */
        .btn-download-glow {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        .btn-download-glow:hover {
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.8), 0 0 40px rgba(16, 185, 129, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="panel w-full max-w-lg rounded-2xl p-8">
        <h1 class="font-tech text-xl font-bold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-500 tracking-wider">
            SMARTCARD GENERATOR
        </h1>

        <!-- Form Input -->
        <div class="space-y-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-tech">Place ID Google</label>
                <input type="text" id="inputQuery" placeholder="Contoh: ChIJNWi0z2-deC4RQzfDw8kDoDA" 
                    class="w-full px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
            </div>

            <button onclick="generateCard()" id="btnProcess"
                class="w-full py-3.5 rounded-xl btn-glow font-tech tracking-wider text-sm active:scale-95">
                PROSES & BUAT KARTU
            </button>
        </div>

        <!-- Status Loading -->
        <div id="loadingStatus" class="hidden text-center mt-6 text-sky-400 text-sm font-medium animate-pulse font-tech">
            > MERAKIT QR CODE...
        </div>

        <!-- Canvas Tersembunyi -->
        <canvas id="canvas" width="1080" height="1080" class="hidden"></canvas>

        <!-- Hasil Akhir -->
        <div id="resultSection" class="hidden mt-8 text-center border-t border-slate-800 pt-6">
            <h3 class="text-sm font-medium mb-4 text-slate-300 font-tech">KARTU BERHASIL DIBUAT! 🎉</h3>
            <div class="flex justify-center mb-6">
                <img id="outputPreview" class="w-64 rounded-2xl shadow-2xl border border-slate-800" alt="Hasil Kartu Review">
            </div>
            <a id="downloadBtn" download="Kartu-Google-Review.png" 
                class="inline-block w-full py-3.5 rounded-xl btn-download-glow font-tech tracking-wider text-sm">
                DOWNLOAD GAMBAR (PNG)
            </a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYenFPWC8zwnYgeF_Rl3W8o8Ndw4muz4--bfCW6tm6CvCVMIGkvkUf-T2TLpaIwxsHTw/exec";

        async function generateCard() {
            let query = document.getElementById('inputQuery').value.trim();
            const loadingStatus = document.getElementById('loadingStatus');
            const resultSection = document.getElementById('resultSection');
            const btnProcess = document.getElementById('btnProcess');

            if (!query) {
                alert("Mohon masukkan Place ID!");
                return;
            }

            loadingStatus.classList.remove('hidden');
            resultSection.classList.add('hidden');
            btnProcess.disabled = true;

            try {
                const response = await fetch(`${SCRIPT_URL}?q=${encodeURIComponent(query)}`);
                const reviewLink = await response.text();

                const tempDiv = document.createElement('div');
                new QRCode(tempDiv, {
                    text: reviewLink,
                    width: 400,
                    height: 400,
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');

                    const template = new Image();
                    template.src = 'template.png';

                    template.onload = function() {
                        ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

                        const qrCanvas = tempDiv.querySelector('canvas');
                        if (!qrCanvas) {
                            alert("Gagal membuat QR Code.");
                            loadingStatus.classList.add('hidden');
                            btnProcess.disabled = false;
                            return;
                        }

                        const qrImage = new Image();
                        qrImage.src = qrCanvas.toDataURL("image/png");

                        qrImage.onload = function() {
                            const qrX = 375;  
                            const qrY = 475;  
                            const qrSize = 330; 

                            ctx.drawImage(qrImage, qrX, qrY, qrSize, qrSize);

                            const finalDataUrl = canvas.toDataURL("image/png");
                            document.getElementById('outputPreview').src = finalDataUrl;
                            document.getElementById('downloadBtn').href = finalDataUrl;

                            loadingStatus.classList.add('hidden');
                            resultSection.classList.add('hidden'); // Biar tetap rapi
                            resultSection.classList.remove('hidden');
                            btnProcess.disabled = false;
                        };
                    };

                    template.onerror = function() {
                        loadingStatus.classList.add('hidden');
                        btnProcess.disabled = false;
                        alert("Gagal memuat file 'template.png'. Pastikan gambar templat ada di folder GitHub!");
                    };

                }, 500);

            } catch (error) {
                loadingStatus.classList.add('hidden');
                btnProcess.disabled = false;
                alert("Gagal terhubung ke server: " + error);
            }
        }
    </script>
</body>
</html>
